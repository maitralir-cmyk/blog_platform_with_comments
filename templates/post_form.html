{% extends "base.html" %}{% block title %}{% if post %}Edit post{% else %}Write a post{% endif %} · InkSpace{% endblock %}
{% block content %}<section class="editor"><p class="eyebrow">YOUR NEXT STORY</p><h1>{% if post %}Edit your story{% else %}Write something meaningful.{% endif %}</h1>
<form method="post" class="form"><label>Post title<input name="title" maxlength="160" required value="{{ post.title if post else '' }}" placeholder="Give your story a title"></label><label>Your story<textarea name="content" rows="13" required placeholder="Start writing here...">{{ post.content if post else '' }}</textarea></label><div class="editor-actions"><a class="button secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="button" type="submit">{% if post %}Save changes{% else %}Publish story{% endif %}</button></div></form></section>{% endblock %}
