{% extends "base.html" %}{% block title %}Log in · InkSpace{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in to InkSpace</h1><p class="muted">Pick up where your ideas left off.</p>
<form method="post" class="form">
<label>Username or email<input name="identity" required placeholder="Username or email"></label>
<label>Password<input type="password" name="password" required placeholder="Your password"></label>
<button class="button full" type="submit">Log in</button></form><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
