{% extends "base.html" %}{% block title %}Create account · InkSpace{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">BECOME A MEMBER</p><h1>Create your account</h1><p class="muted">Join the community and share your perspective.</p>
<form method="post" class="form">
<label>Username<input name="username" minlength="3" required placeholder="Your name"></label>
<label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" minlength="8" required placeholder="At least 8 characters"></label>
<button class="button full" type="submit">Create account</button></form><p class="auth-switch">Already a member? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
